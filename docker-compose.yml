services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blogagentic
      POSTGRES_PASSWORD: blogagentic
      POSTGRES_DB: blogagentic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blogagentic"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://blogagentic:blogagentic@db:5432/blogagentic
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
