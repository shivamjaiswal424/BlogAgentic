[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "uvicorn>=0.52.3",
    "watchdog>=6.0.0",
]

[project.scripts]
blogagentic = "blogagentic:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
