[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-cli[inmem]>=0.4.31",
    "psycopg[binary,pool]>=3.3.5",
    "uvicorn>=0.52.3",
    "watchdog>=6.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["."]

[tool.ruff.lint]
# BLE001 (no bare `except Exception`) is disabled: the graceful-degradation
# fallbacks in research()/groqllm.py deliberately catch any failure from an
# external API, not a specific exception type.
ignore = ["BLE001"]
